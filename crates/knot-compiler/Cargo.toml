[package]
name = "knot-compiler"
version.workspace = true
edition.workspace = true

[lib]
name = "knot_compiler"
path = "src/lib.rs"

[[bin]]
name = "knot"
path = "src/main.rs"

[dependencies]
knot = { workspace = true }
knot-runtime = { workspace = true }
cranelift-codegen = { workspace = true }
cranelift-frontend = { workspace = true }
cranelift-module = { workspace = true }
cranelift-object = { workspace = true }
cranelift-native = { workspace = true }
libc = { workspace = true }
target-lexicon = { workspace = true }
# .eh_frame emission for generated functions (see src/unwind.rs) — versions
# pinned to what cranelift 0.131 itself uses.
gimli = { version = "0.33", default-features = false, features = ["write"] }
object = { version = "0.39", default-features = false, features = ["write"] }
# Z3 for compile-time refinement-predicate implication (SMT subtyping between
# refined types). `gh-release` statically links a prebuilt libz3 (downloaded at
# build time), so the compiler binary is self-contained — no runtime Z3 dep.
z3 = { version = "0.20", default-features = false, features = ["gh-release"] }
# Content-hash of the embedded runtime archive, used at link time to reject a
# stale on-disk libknot_runtime.a (replaces the old mtime heuristic).
blake3 = { version = "1", default-features = false }
# Order-preserving map for record/variant field storage: source definition order
# is retained so implicit-field (^name) resolution can try fields in
# bottom-to-top declaration order instead of BTreeMap's alphabetical order.
indexmap = { version = "2", default-features = false }
cranelift-jit = "0.131"

[build-dependencies]
blake3 = { version = "1", default-features = false }
